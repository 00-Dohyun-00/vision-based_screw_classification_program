<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screw Vision Classifier</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1420; }

      /* React가 뜨기 전까지 잠깐 보이는 로딩 화면. JS 번들 로딩을 기다릴 필요 없이
         HTML만으로 바로 그려지도록 인라인 스타일로 넣었다. App.jsx가 마운트되면 제거됨. */
      #boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0e1420;
        color: #9fb0c8;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
        z-index: 9999;
      }
      #boot-loading .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #223049;
        border-top-color: #3ddc84;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot-loading .label {
        font-size: 13px;
        letter-spacing: 0.04em;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="boot-loading">
      <div class="spinner"></div>
      <div class="label">불러오는 중...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
